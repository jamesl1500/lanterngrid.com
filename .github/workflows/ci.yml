name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            web:
              - *shared
              - 'apps/web/**'
              - 'packages/**'
            api:
              - *shared
              - 'pyproject.toml'
              - 'uv.lock'
              - 'apps/api/**'
              - 'packages/api-client/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test and build
        run: pnpm turbo run lint typecheck test build --filter='!@lanterngrid/api'
        env:
          API_URL: http://localhost:8000

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lanterngrid
          POSTGRES_PASSWORD: lanterngrid
          POSTGRES_DB: lanterngrid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lanterngrid"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lanterngrid:lanterngrid@localhost:5432/lanterngrid
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy app scripts tests
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest

  # The committed TypeScript client must match the API's current OpenAPI schema.
  api-contract:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm gen:api
      - name: Check the generated client is up to date
        run: |
          if ! git diff --exit-code -- packages/api-client; then
            echo "::error::packages/api-client is out of date. Run 'pnpm gen:api' and commit the result."
            exit 1
          fi
