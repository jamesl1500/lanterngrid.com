# Local services for development. Start with `pnpm services:up`.
name: lanterngrid

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lanterngrid
      POSTGRES_PASSWORD: lanterngrid
      POSTGRES_DB: lanterngrid
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lanterngrid']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for avatars and uploads (Cloudflare R2 in production).
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: lanterngrid
      MINIO_ROOT_PASSWORD: lanterngrid
    ports:
      - '9000:9000'
      - '9101:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the media bucket once MinIO is up. Anyone can read files; only presigned URLs
  # from the API can write them. MinIO allows cross-origin uploads by default.
  minio-setup:
    # The server image ships the mc client; minio/mc is no longer on Docker Hub.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 lanterngrid lanterngrid &&
      mc mb --ignore-existing local/lanterngrid-media &&
      mc anonymous set download local/lanterngrid-media
      "
    restart: 'no'

  # Catches outgoing email. Inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
