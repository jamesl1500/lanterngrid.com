# Local services for development. Start with `pnpm services:up`.
name: lanterngrid

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lanterngrid
      POSTGRES_PASSWORD: lanterngrid
      POSTGRES_DB: lanterngrid
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lanterngrid']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for avatars and uploads (Cloudflare R2 in production).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: lanterngrid
      MINIO_ROOT_PASSWORD: lanterngrid
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  # Catches outgoing email. Inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
